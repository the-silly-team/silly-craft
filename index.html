<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>silly craft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>🧠 silly craft <span class="ai-badge">AI-powered</span></h1>
      <p class="sub">combine elements to discover new ones.</p>
    </div>
    <div class="header-right">
      <div class="stat"><span class="val" id="discovered">4</span><span class="lbl">discovered</span></div>
      <div class="stat"><span class="val" id="combos">0</span><span class="lbl">combinations</span></div>
    </div>
  </header>
  <div class="main">
    <div class="elements-panel">
      <div class="panel-header">
        <h2>elements</h2>
        <button class="clear-btn" onclick="clearCanvas()">clear canvas</button>
      </div>
      <button class="settings-btn" onclick="toggleSettings()">⚙️ AI settings</button>
      <div class="settings-panel" id="settingsPanel">
        <label>API key</label>
        <input type="password" id="apiKey" placeholder="paste..." oninput="saveApiKey()">
        <div class="status" id="apiStatus">no key</div>
      </div>
      <input class="search-box" id="search" placeholder="search..." oninput="filterElements()">
      <div class="elements-grid" id="elGrid"></div>
    </div>
    <div class="canvas-area" id="canvas">
      <div class="hint" id="hint">
        <div class="hint-icon">✨</div>
        <div>drag elements here</div>
      </div>
    </div>
  </div>
  <div class="footer">footer</div>
</div>
<div class="result-toast" id="toast"></div>
<script src="game.js"></script>
</body>
</html>
